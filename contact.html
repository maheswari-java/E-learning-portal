<section>
    <h1>Contact Us</h1>
    <p>Have a question? Send us a message.</p>

    <form onsubmit="return sendMessage()">
        <p><input type="text" id="contactName" placeholder="Your Name"></p>
        <p><input type="email" id="contactEmail" placeholder="Your Email"></p>
        <p><textarea id="contactMessage" placeholder="Your Message"></textarea></p>

        <button type="submit">Send Message</button>
        <p id="contactResult"></p>
    </form>

    <h3>Contact Information</h3>
    <p>Email: support@learnhub.com</p>
    <p>Working Hours: Monday - Friday</p>
</section>
